
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy 20/10 - Trâm Anh</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --purple: #a855f7;
    --pink: #f0abfc;
    --blue: #67e8f9;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: #050511;
    color: white;
    font-family: "Segoe UI", Arial, sans-serif;
    perspective: 1200px;
    isolation: isolate;
}

/* Vũ trụ nền */
.space {
    position: fixed;
    inset: 0;
    z-index: -3;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 20% 25%, #32145b 0%, transparent 45%),
        radial-gradient(ellipse at 80% 75%, #102b59 0%, transparent 45%),
        #050511;
}

.nebula {
    position: absolute;
    width: 65vw;
    height: 65vw;
    min-width: 350px;
    min-height: 350px;
    border-radius: 50%;
    filter: blur(75px);
    opacity: .24;
    animation: nebulaMove 16s ease-in-out infinite alternate;
}

.nebula.one {
    background: #9333ea;
    top: -30%;
    left: -20%;
}

.nebula.two {
    background: #2563eb;
    bottom: -35%;
    right: -20%;
    animation-delay: -8s;
}

#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
}

/* Các hành tinh */
.orbit {
    position: fixed;
    width: min(85vw, 650px);
    aspect-ratio: 1;
    border: 1px solid rgba(196,181,253,.12);
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
    animation: rotateOrbit 35s linear infinite;
}

.orbit::before,
.orbit::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 18px 5px #c084fc;
}

.orbit::before {
    top: 12%;
    left: 17%;
}

.orbit::after {
    bottom: 12%;
    right: 15%;
    background: var(--blue);
    box-shadow: 0 0 18px 5px #67e8f9;
}

/* Thiệp 3D */
.card-wrap {
    width: min(90%, 500px);
    transform-style: preserve-3d;
    z-index: 2;
}

.card {
    position: relative;
    overflow: hidden;
    padding: 38px 25px;
    text-align: center;
    border: 1px solid rgba(216,180,254,.35);
    border-radius: 28px;
    background: linear-gradient(
        145deg,
        rgba(40,24,73,.83),
        rgba(9,13,37,.86)
    );
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
        0 0 35px rgba(168,85,247,.18),
        0 25px 80px rgba(0,0,0,.5),
        inset 0 0 30px rgba(196,181,253,.05);
    transform-style: preserve-3d;
    animation: floatCard 5s ease-in-out infinite;
}

.card::before {
    content: "";
    position: absolute;
    inset: -100%;
    background: linear-gradient(
        115deg,
        transparent 42%,
        rgba(255,255,255,.12) 50%,
        transparent 58%
    );
    transform: translateX(-60%);
    animation: shine 7s ease-in-out infinite;
    pointer-events: none;
}

.card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 1px solid rgba(255,255,255,.04);
    pointer-events: none;
}

.content {
    position: relative;
    z-index: 1;
    transform: translateZ(35px);
}

.label {
    color: #c4b5fd;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(38px, 9vw, 57px);
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(
        135deg,
        #ffffff 10%,
        #d8b4fe 45%,
        #f0abfc 70%,
        #a5f3fc
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 0 #5b21b6)
            drop-shadow(0 0 16px rgba(192,132,252,.45));
    animation: textGlow 5s linear infinite;
}

.year {
    margin-top: 12px;
    font-size: 12px;
    color: #a5b4fc;
    letter-spacing: 7px;
}

.star-divider {
    margin: 23px auto;
    color: #e9d5ff;
    letter-spacing: 12px;
    text-shadow: 0 0 15px #c084fc;
}

.name {
    font-size: clamp(31px, 8vw, 43px);
    font-weight: 800;
    letter-spacing: 2px;
    color: #f5d0fe;
    text-shadow:
        0 2px 0 #a21caf,
        0 5px 0 #581c87,
        0 0 24px rgba(232,121,249,.65);
    animation: nameGlow 3s ease-in-out infinite alternate;
}

.message {
    margin: 22px auto 0;
    max-width: 370px;
    color: #e5e7eb;
    font-size: 14px;
    line-height: 1.9;
}

.message strong {
    color: #e9d5ff;
    font-weight: 600;
}

.footer {
    margin-top: 26px;
    font-size: 10px;
    color: #a5b4fc;
    letter-spacing: 3px;
}

.hint {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    color: rgba(221,214,254,.65);
    font-size: 11px;
    letter-spacing: 1px;
    z-index: 3;
}

/* Hạt sáng */
.particle {
    position: fixed;
    bottom: -30px;
    z-index: 1;
    pointer-events: none;
    color: #e9d5ff;
    text-shadow: 0 0 12px #c084fc;
    animation: rise linear forwards;
}

/* Chuyển động */
@keyframes floatCard {
    0%, 100% {
        transform: translateY(0) rotateX(1deg);
    }
    50% {
        transform: translateY(-10px) rotateX(-1deg);
    }
}

@keyframes rotateOrbit {
    to { transform: rotate(360deg); }
}

@keyframes nebulaMove {
    from { transform: translate(0,0) scale(.9); }
    to { transform: translate(12%,8%) scale(1.15); }
}

@keyframes textGlow {
    to { background-position: 200% center; }
}

@keyframes nameGlow {
    from { filter: brightness(.9); }
    to { filter: brightness(1.25); }
}

@keyframes shine {
    0%, 65% { transform: translateX(-60%); }
    100% { transform: translateX(60%); }
}

@keyframes rise {
    0% {
        transform: translate3d(0,0,0) rotate(0);
        opacity: 0;
    }
    15% { opacity: .9; }
    100% {
        transform: translate3d(var(--drift),-110vh,0) rotate(360deg);
        opacity: 0;
    }
}

@media (max-width: 480px) {
    .card {
        padding: 32px 19px;
        border-radius: 23px;
    }

    .label { letter-spacing: 3px; }
    .message { font-size: 13px; }
    .orbit { width: 95vw; }
    .hint { font-size: 9px; }
}

@media (prefers-reduced-motion: reduce) {
    .card, .nebula, .orbit, h1, .name, .card::before {
        animation-duration: 20s;
    }
}
</style>
</head>

<body>

<div class="space">
    <div class="nebula one"></div>
    <div class="nebula two"></div>
</div>

<canvas id="stars"></canvas>
<div class="orbit"></div>

<main class="card-wrap" id="cardWrap">
    <section class="card">
        <div class="content">

            <div class="label">A special day for you</div>

            <h1>HAPPY<br>20/10</h1>

            <div class="year">TWO ZERO · TWO SIX</div>

            <div class="star-divider">✦ ✧ ✦</div>

            <div class="name">TRÂM ANH</div>

            <p class="message">
                Chúc Trâm Anh có một ngày 20/10 thật vui,
                luôn tự tin, học tốt và giữ mãi năng lượng tích cực.
                <br>
                <strong>Tuổi 17, thật nhiều trải nghiệm đáng nhớ nhé!</strong>
            </p>

            <div class="footer">
                A LITTLE WISH · JUST FOR YOU
            </div>

        </div>
    </section>
</main>

<div class="hint">✦ kiki ✦</div>

<script>
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];
let width, height;
let animationFrame;

function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.min(
        180,
        Math.floor(width * height / 4500)
    );

    stars = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.5 + 0.3,
        alpha: Math.random(),
        speed: Math.random() * 0.012 + 0.003,
        phase: Math.random() * Math.PI * 2
    }));
}

function drawStars(time) {
    ctx.clearRect(0, 0, width, height);

    for (const s of stars) {
        const glow = 0.25 +
            Math.abs(Math.sin(time * s.speed + s.phase)) * 0.75;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);

        ctx.fillStyle = `rgba(226, 215, 255, ${glow})`;
        ctx.shadowBlur = s.radius * 7;
        ctx.shadowColor = "#c084fc";
        ctx.fill();
    }

    ctx.shadowBlur = 0;
    animationFrame = requestAnimationFrame(drawStars);
}

resizeCanvas();
drawStars(0);

window.addEventListener("resize", resizeCanvas);

/* Tạo hạt sáng bay */
function createParticle() {
    const p = document.createElement("span");

    p.className = "particle";
    p.textContent = Math.random() > 0.5 ? "✦" : "·";

    p.style.left = Math.random() * 100 + "vw";
    p.style.fontSize = (10 + Math.random() * 14) + "px";
    p.style.animationDuration = (6 + Math.random() * 7) + "s";
    p.style.setProperty(
        "--drift",
        (Math.random() * 100 - 50) + "px"
    );

    document.body.appendChild(p);

    p.addEventListener("animationend", () => p.remove());
}

setInterval(createParticle, 400);

/* Nghiêng thiệp 3D theo chuột hoặc cảm ứng */
const cardWrap = document.getElementById("cardWrap");

function tiltCard(x, y) {
    const rect = cardWrap.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const rotateY = ((x - centerX) / rect.width) * 10;
    const rotateX = -((y - centerY) / rect.height) * 10;

    cardWrap.style.animation = "none";
    cardWrap.style.transform =
        `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
}

function resetCard() {
    cardWrap.style.transform = "";
    cardWrap.style.animation = "";
}

window.addEventListener("mousemove", (e) => {
    tiltCard(e.clientX, e.clientY);
});

window.addEventListener("mouseleave", resetCard);

window.addEventListener("touchmove", (e) => {
    if (e.touches.length > 0) {
        tiltCard(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: true });

window.addEventListener("touchend", resetCard);
</script>

</body>
</html>
